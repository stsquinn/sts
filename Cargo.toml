[package]
name = "sts"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Utility CLI that automates day-to-day company work on Ubuntu and Fedora"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
ctrlc = "3.5.2"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
which = "8.0.6"
